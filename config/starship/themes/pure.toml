# DevKit Pure Starship prompt
add_newline = true
command_timeout = 1000

format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
format = "[$path]($style) "
style = "blue"
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = "[$branch]($style)"
style = "purple"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "yellow"
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[cmd_duration]
format = " [$duration]($style)"
min_time = 2000
style = "yellow"

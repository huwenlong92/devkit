# DevKit pastel powerline Starship prompt
add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$golang\
$rust\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
format = "[ $path ]($style)"
style = "bold fg:#1f2335 bg:#a6e3a1"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[ $symbol$branch ]($style)"
style = "bold fg:#1f2335 bg:#cba6f7"
symbol = "git:"

[git_status]
format = "[ $all_status$ahead_behind ]($style)"
style = "bold fg:#1f2335 bg:#f9e2af"
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[nodejs]
format = "[ $symbol$version ]($style)"
style = "fg:#1f2335 bg:#94e2d5"
symbol = "node "

[golang]
format = "[ $symbol$version ]($style)"
style = "fg:#1f2335 bg:#89dceb"
symbol = "go "

[rust]
format = "[ $symbol$version ]($style)"
style = "fg:#1f2335 bg:#fab387"
symbol = "rs "

[python]
format = "[ ${symbol}${version} ]($style)"
style = "fg:#1f2335 bg:#f5c2e7"
symbol = "py "

[cmd_duration]
format = "[ $duration ]($style)"
min_time = 2000
style = "fg:#1f2335 bg:#f9e2af"

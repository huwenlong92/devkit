# DevKit plain text symbols Starship prompt
add_newline = true
command_timeout = 1000

format = "$directory$git_branch$git_status$nodejs$golang$rust$python$cmd_duration$line_break$character"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold yellow)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold purple"
symbol = "git:"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
conflicted = "="
ahead = "up${count}"
behind = "down${count}"
diverged = "up${ahead_count}down${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = ">${count}"
deleted = "x${count}"

[nodejs]
format = "[$symbol$version ]($style)"
style = "green"
symbol = "node "

[golang]
format = "[$symbol$version ]($style)"
style = "cyan"
symbol = "go "

[rust]
format = "[$symbol$version ]($style)"
style = "red"
symbol = "rs "

[python]
format = "[${symbol}${version} ]($style)"
style = "yellow"
symbol = "py "

[cmd_duration]
format = "[$duration ]($style)"
min_time = 2000
style = "yellow"

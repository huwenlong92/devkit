# DevKit Nerd Font symbols Starship prompt
add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$golang\
$rust\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"
vimcmd_symbol = "[](bold yellow)"

[directory]
format = "[$read_only$path]($style) "
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false
read_only = " "

[git_branch]
format = "[$symbol $branch]($style) "
style = "bold purple"
symbol = ""

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
conflicted = "󰞇"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰆓"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[nodejs]
format = "[$symbol $version ]($style)"
style = "green"
symbol = ""

[golang]
format = "[$symbol $version ]($style)"
style = "cyan"
symbol = ""

[rust]
format = "[$symbol $version ]($style)"
style = "red"
symbol = ""

[python]
format = "[$symbol $version ]($style)"
style = "yellow"
symbol = ""

[docker_context]
format = "[$symbol $context ]($style)"
style = "blue"
symbol = ""

[cmd_duration]
format = "[$duration]($style) "
min_time = 2000
style = "yellow"

# DevKit compact Starship prompt
add_newline = false
command_timeout = 1000

format = "$directory$git_branch$git_status$nodejs$golang$rust$python$cmd_duration$character"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold yellow)"

[directory]
format = "[$path]($style) "
style = "cyan"
truncation_length = 2
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style)"
style = "purple"
symbol = "git:"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[nodejs]
format = "[$symbol$version ]($style)"
style = "green"
symbol = "node "

[golang]
format = "[$symbol$version ]($style)"
style = "cyan"
symbol = "go "

[rust]
format = "[$symbol$version ]($style)"
style = "red"
symbol = "rs "

[python]
format = "[${symbol}${version} ]($style)"
style = "yellow"
symbol = "py "

[cmd_duration]
format = "[$duration ]($style)"
min_time = 2000
style = "yellow"

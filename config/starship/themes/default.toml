# DevKit Starship prompt
add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$golang\
$nodejs\
$rust\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold purple"
symbol = "git:"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[golang]
format = "[$symbol($version )]($style)"
style = "bold cyan"
symbol = "go "

[nodejs]
format = "[$symbol($version )]($style)"
style = "bold green"
symbol = "node "

[rust]
format = "[$symbol($version )]($style)"
style = "bold red"
symbol = "rust "

[python]
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
style = "bold yellow"
symbol = "py "

[docker_context]
format = "[$symbol$context ]($style)"
style = "blue"
symbol = "docker "

[cmd_duration]
format = "[$duration]($style) "
min_time = 2000
style = "bold yellow"
